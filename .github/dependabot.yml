version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    groups:
      compatible-rust-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  # Review scripts/release/sparkle.json alongside Sparkle dependency updates.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    groups:
      compatible-swift-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  # As of 2026-09-01, Dependabot cannot read Bun 1.4's v2 lockfile.
  # Site dependencies need manual updates until v2 support is available.
